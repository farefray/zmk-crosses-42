<svg width="908" height="376" viewBox="0 0 908 376" class="keymap" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>/* inherit to force styles through use tags */
svg path {
    fill: inherit;
}

/* font and background color specifications */
svg.keymap {
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    font-size: 14px;
    font-kerning: normal;
    text-rendering: optimizeLegibility;
    fill: #24292e;
}

/* default key styling */
rect.key {
    fill: #f6f8fa;
}

rect.key, rect.combo {
    stroke: #c9cccf;
    stroke-width: 1;
}

/* default key side styling, only used is draw_key_sides is set */
rect.side {
    filter: brightness(90%);
}

/* color accent for combo boxes */
rect.combo, rect.combo-separate {
    fill: #cdf;
}

/* color accent for held keys */
rect.held, rect.combo.held {
    fill: #fdd;
}

/* color accent for ghost (optional) keys */
rect.ghost, rect.combo.ghost {
    stroke-dasharray: 4, 4;
    stroke-width: 2;
}

text {
    text-anchor: middle;
    dominant-baseline: middle;
}

/* styling for layer labels */
text.label {
    font-weight: bold;
    text-anchor: start;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for optional footer */
text.footer {
    text-anchor: end;
    dominant-baseline: auto;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for combo tap, and key non-tap label text */
text.combo, text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br {
    font-size: 11px;
}

text.hold, text.bl, text.br {
    text-anchor: middle;
    dominant-baseline: auto;
}

text.shifted, text.tl, text.tr {
    text-anchor: middle;
    dominant-baseline: hanging;
}

text.left, text.tl, text.bl {
    text-anchor: start;
}

text.right, text.tr, text.br {
    text-anchor: end;
}

text.layer-activator {
    text-decoration: underline;
}

/* styling for hold/shifted label text in combo box */
text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right {
    font-size: 8px;
}

/* lighter symbol for transparent keys */
text.trans {
    fill: #7b7e81;
}

/* styling for combo dendrons */
path.combo {
    stroke-width: 1;
    stroke: gray;
    fill: none;
}

/* Start Tabler Icons Cleanup */
/* cannot use height/width with glyphs */
.icon-tabler > path {
    fill: inherit;
    stroke: inherit;
    stroke-width: 2;
}
/* hide tabler's default box */
.icon-tabler > path[stroke="none"][fill="none"] {
    visibility: hidden;
}
/* End Tabler Icons Cleanup */

@media (prefers-color-scheme: dark) {
svg.keymap { fill: #d1d6db; }
rect.key { fill: #3f4750; }
rect.key, rect.combo { stroke: #60666c; }
rect.combo, rect.combo-separate { fill: #1f3d7a; }
rect.held, rect.combo.held { fill: #854747; }
text.label, text.footer { stroke: black; }
text.trans { fill: #7e8184; }
path.combo { stroke: #7f7f7f; }

}
svg.keymap {
  font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
  font-size: 10px;
  font-weight: bold;
}

text.label {
  stroke: #dfdfde;
  stroke-width: 12;
  stroke-linejoin: round;
}

rect.combo, rect.combo-separate {
  opacity: 0.95;
  stroke: #c9cccf;
  stroke-width: 0.5;
  fill: #d7eaed;
}
path.combo {
  stroke-dasharray: 4, 4;
  stroke-opacity: 0.3;
}

rect.held, rect.combo.held {
  fill: #ebdada;
}

rect.added {
  fill: #2f7d46;
  stroke: #205831;
  stroke-width: 2;
}
text.added {
  fill: white;
  paint-order: stroke;
  stroke: #205831;
  stroke-width: 2px;
  stroke-linejoin: round;
}

.trans.tap, .ghost.tap {
  opacity: 0.5;
}

.shifted {
  translate: -9px 3px;
  opacity: 0.3;
}

.toggle.shifted {
  translate: -12px 17px;
  opacity: 1.0;
}
.toggle.hold {
  translate: 12px -25px;
}

.text_with_symbol.tap {
  translate: -1px 1px;
}
.text_with_symbol.shifted {
  translate: 8px 13px;
  font-size: 8px;
  opacity: 1.0;
}

.combo.text_with_symbol.tap {
  translate: -1px 1px;
}
.combo.text_with_symbol.shifted {
  translate: 7px 5px;
  font-size: 8px;
  opacity: 1.0;
}

rect.trackball {
  rx: 28px;
  ry: 28px;
  fill: #a63d40;
  stroke: #74282b;
  stroke-width: 2;
}
text.trackball {
  fill: white;
  paint-order: stroke;
  stroke: #74282b;
  stroke-width: 2px;
  stroke-linejoin: round;
}
</style>
